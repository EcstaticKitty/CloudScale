apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudscale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudscale
  template:
    metadata:
      labels:
        app: cloudscale
    spec:
      containers:
        - name: cloudscale
          image: cloudscale:v3
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 10000
          envFrom:
            - secretRef:
                name: cloudscale-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /login
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 10000
            initialDelaySeconds: 15
            periodSeconds: 20
