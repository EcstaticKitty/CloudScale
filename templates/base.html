<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d18">
  <title>{% block title %}CloudScale{% endblock %}</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link
    href="https://googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d18;
      --panel: rgba(24, 27, 47, .78);
      --panel2: rgba(30, 34, 58, .72);
      --line: rgba(171, 158, 255, .18);
      --text: #f0efff;
      --muted: #9a9bb7;
      --purple: #b4a0ff;
      --blue: #7bc8ff;
      --mint: #8fe0bd;
      --rose: #f0a0ae;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Space Grotesk', sans-serif
    }

    * {
      box-sizing: border-box
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--sans);
      background: radial-gradient(ellipse at 12% 0%, rgba(104, 79, 190, .20), transparent 38%), radial-gradient(ellipse at 92% 28%, rgba(42, 111, 151, .15), transparent 34%), var(--bg);
      background-attachment: fixed;
      overflow-x: hidden
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: linear-gradient(rgba(160, 145, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(160, 145, 255, .035) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 92%)
    }

    body:after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: .10;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(0, 0, 0, .48) 4px)
    }

    a {
      color: var(--blue);
      text-decoration: none
    }

    a:hover {
      color: #c2e7ff
    }

    .topbar {
      position: relative;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 12, 24, .82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px)
    }

    .topbar-inner {
      max-width: 1120px;
      margin: auto;
      padding: 15px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -.8px
    }

    .brand:hover {
      color: white
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(190, 176, 255, .4);
      border-radius: 9px;
      background: linear-gradient(145deg, rgba(164, 139, 255, .28), rgba(89, 181, 220, .13));
      color: #d9d0ff;
      box-shadow: 0 0 24px rgba(145, 116, 255, .18);
      font-size: 18px
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
      font: 11px var(--mono);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted)
    }

    .online {
      color: var(--mint);
      white-space: nowrap
    }

    .online:before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 8px 1px 0;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 10px var(--mint)
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      color: var(--text);
      letter-spacing: 0;
      text-transform: none;
      font: 12px var(--sans)
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: rgba(180, 160, 255, .16);
      color: var(--purple);
      font: 12px var(--mono)
    }

    .logout {
      font: 11px var(--mono);
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--rose)
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 26px 28px
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      color: #8587a5;
      font: 10px var(--mono);
      letter-spacing: 1.5px;
      text-transform: uppercase
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 28px;
      margin-bottom: 30px
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--blue);
      font: 11px var(--mono);
      letter-spacing: 2px;
      text-transform: uppercase
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.04;
      letter-spacing: -2.5px;
      font-weight: 700
    }

    .hero h1 span {
      display: block;
      color: var(--purple)
    }

    .hero-copy {
      max-width: 590px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8
    }

    .clock-card {
      min-width: 148px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .018));
      box-shadow: 0 12px 32px rgba(0, 0, 0, .18)
    }

    .clock-label {
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: 1px;
      text-transform: uppercase
    }

    .clock {
      margin-top: 8px;
      color: #e5dcff;
      text-align: right;
      font: 24px var(--mono);
      font-variant-numeric: tabular-nums
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px
    }

    .panel,
    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 15px 42px rgba(0, 0, 0, .16)
    }

    .stat {
      padding: 17px 19px;
      border-radius: 11px;
      position: relative;
      overflow: hidden
    }

    .stat:after {
      content: "";
      position: absolute;
      width: 95px;
      height: 95px;
      right: -38px;
      top: -45px;
      border-radius: 50%;
      background: var(--glow, rgba(180, 160, 255, .13));
      filter: blur(4px)
    }

    .stat-label {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: 1.2px;
      text-transform: uppercase
    }

    .stat-value {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      font: 26px var(--mono);
      color: var(--text)
    }

    .stat.total {
      --glow: rgba(180, 160, 255, .18)
    }

    .stat.active {
      --glow: rgba(123, 200, 255, .16)
    }

    .stat.done {
      --glow: rgba(143, 224, 189, .16)
    }

    .panel {
      border-radius: 12px;
      padding: 21px
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 14px
    }

    .section-title {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.5px
    }

    .section-note {
      margin-top: 4px;
      color: var(--muted);
      font: 10px var(--mono);
      letter-spacing: .8px;
      text-transform: uppercase
    }

    .task-form {
      display: flex;
      gap: 10px
    }

    .field {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid rgba(173, 163, 224, .22);
      border-radius: 8px;
      outline: none;
      background: rgba(7, 9, 19, .56);
      color: var(--text);
      font: 13px var(--sans);
      transition: border-color .2s, box-shadow .2s
    }

    .field::placeholder {
      color: #777b99
    }

    .field:focus {
      border-color: rgba(180, 160, 255, .75);
      box-shadow: 0 0 0 3px rgba(180, 160, 255, .10)
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 11px 15px;
      font: 11px var(--mono);
      letter-spacing: .6px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .18s, background .18s, border-color .18s
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .btn-primary {
      background: linear-gradient(120deg, #8972d4, #4e94ba);
      color: #fff;
      box-shadow: 0 5px 18px rgba(112, 104, 206, .2)
    }

    .btn-primary:hover {
      color: white;
      filter: brightness(1.1)
    }

    .btn-quiet {
      background: rgba(255, 255, 255, .04);
      border-color: var(--line);
      color: var(--muted)
    }

    .btn-done {
      background: rgba(143, 224, 189, .09);
      border-color: rgba(143, 224, 189, .22);
      color: var(--mint)
    }

    .btn-delete {
      background: rgba(240, 160, 174, .07);
      border-color: rgba(240, 160, 174, .2);
      color: var(--rose)
    }

    .task-section {
      margin-top: 27px
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .filter-btn {
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font: 10px var(--mono);
      cursor: pointer;
      transition: color .18s, background .18s, border-color .18s
    }

    .filter-btn:hover {
      color: var(--text)
    }
    .filter-btn.active {
border-color: var(--line);
background: rgba(180, 160, 255, .10);
color: var(--purple)
}
.count-tag {
padding: 6px 9px;
border: 1px solid var(--line);
border-radius: 7px;
color: var(--blue);
font: 10px var(--mono);
white-space: nowrap
}
.task-list {
display: grid;
gap: 9px
}
.task-card {
display: flex;
justify-content: space-between;
align-items: center;
gap: 14px;
padding: 14px 15px;
border: 1px solid rgba(171, 158, 255, .13);
border-radius: 9px;
background: rgba(255, 255, 255, .035);
transition: background .18s, border-color .18s, transform .18s
}
.task-card[hidden] {
display: none !important;
}
.task-card:hover {
background: rgba(255, 255, 255, .06);
border-color: rgba(171, 158, 255, .3);
transform: translateY(-1px)
}
.task-main {
display: flex;
align-items: center;
gap: 12px;
min-width: 0
}
.task-marker {
width: 20px;
height: 20px;
flex: 0 0 20px;
display: grid;
place-items: center;
border: 1px solid rgba(180, 160, 255, .45);
border-radius: 5px;
color: var(--mint);
font-size: 12px
}
.task-name {
overflow-wrap: anywhere;
font-size: 13px;
color: #e9e8f8
}
.task-name.completed {
color: #777b96;
text-decoration: line-through
}
.task-actions {
display: flex;
gap: 7px;
flex-shrink: 0
}
.task-actions form {
margin: 0
}
.task-actions .btn {
padding: 7px 9px;
font-size: 10px
}
.empty-state {
flex-direction: column;
align-items: center;
justify-content: center;
padding: 38px 18px;
text-align: center;
border: 1px dashed rgba(171, 158, 255, .22);
border-radius: 10px;
background: rgba(255, 255, 255, .018)
}
.empty-state[hidden] {
display: none !important;
}
.empty-state:not([hidden]) {
display: flex;
}
.empty-symbol {
margin-bottom: 10px;
color: var(--purple);
font-size: 27px
}
.empty-title {
font-size: 15px;
font-weight: 600;
color: var(--text)
}
.empty-copy {
margin-top: 5px;
color: var(--muted);
font-size: 12px
}
.flash-stack {
display: grid;
gap: 8px;
margin-bottom: 18px
}
.flash {
padding: 11px 13px;
border: 1px solid var(--line);
border-radius: 8px;
background: rgba(255, 255, 255, .05);
font-size: 12px
}
.flash.success {
border-color: rgba(143, 224, 189, .25);
color: var(--mint)
}
.flash.error {
border-color: rgba(240, 160, 174, .25);
color: var(--rose)
}
.footer {
display: flex;
justify-content: space-between;
flex-wrap: wrap;
gap: 10px;
margin-top: 40px;
padding-top: 17px;
border-top: 1px solid rgba(171, 158, 255, .13);
color: #777b96;
font: 10px var(--mono);
letter-spacing: .7px;
text-transform: uppercase
}
.footer strong {
color: var(--purple);
font-weight: 500
}
.auth-wrap {
position: relative;
z-index: 1;
min-height: calc(100vh - 66px);
display: grid;
place-items: center;
padding: 36px 20px
}
.auth-card {
width: min(100%, 420px);
padding: 30px;
border: 1px solid var(--line);
border-radius: 14px;
background: rgba(23, 26, 46, .86);
backdrop-filter: blur(18px);
box-shadow: 0 22px 65px rgba(0, 0, 0, .3)
}
.auth-brand {
text-align: center;
margin-bottom: 25px
}
.auth-brand .brand {
justify-content: center;
font-size: 24px
}
.auth-brand p {
margin: 10px 0 0;
color: var(--muted);
font: 10px var(--mono);
letter-spacing: 1.2px;
text-transform: uppercase
}
.auth-card h1 {
margin: 0 0 6px;
font-size: 25px;
letter-spacing: -1px
}
.auth-sub {
margin: 0 0 22px;
color: var(--muted);
font-size: 13px
}
.auth-form {
display: grid;
gap: 13px
}
.auth-form label {
display: block;
margin-bottom: 6px;
color: #b4b4cc;
font: 10px var(--mono);
letter-spacing: 1px;
text-transform: uppercase
}
.auth-form .btn {
width: 100%;
margin-top: 5px;
padding: 13px
}
.auth-foot {
margin: 20px 0 0;
text-align: center;
color: var(--muted);
font-size: 12px
}
.auth-foot a {
color: var(--purple)
}
@media(max-width:700px) {
.topbar-inner {
padding: 12px 17px
}
.nav-right {
gap: 10px
}
.online {
display: none
}
.shell {
padding: 27px 17px
}
.hero {
flex-direction: column
}
.clock-card {
width: 100%;
display: flex;
justify-content: space-between;
align-items: center
}
.clock {
margin: 0
}
.stats {
gap: 8px
}
.stat {
padding: 13px
}
.stat-value {
font-size: 22px
}
.panel {
padding: 16px
}
.section-head {
align-items: flex-start;
flex-direction: column
}
.task-form {
flex-direction: column
}
.task-form .btn {
width: 100%
}
.task-card {
align-items: flex-start;
flex-direction: column
}
.task-actions {
width: 100%
}
.task-actions form {
flex: 1
}
.task-actions .btn {
width: 100%
}
.filter-row {
flex-wrap: wrap
}
.meta-row {
font-size: 9px
}
.footer {
font-size: 9px
}
}
    @media(prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        scroll-behavior: auto !important;
        transition: none !important
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') if session.get('user_id') else url_for('login') }}"><span
          class="brand-mark">✳</span>CloudScale</a>
      <div class="nav-right">
        <span class="online">SYSTEM ONLINE</span>
        {% if session.get('user_id') %}
        <span class="user-chip"><span class="user-avatar">{{ session.get('username', 'U')[:1]|upper }}</span>{{
          session.get('username') }}</span>
        <form method="POST" action="{{ url_for('logout') }}" style="margin:0"><input type="hidden" name="csrf_token"
            value="{{ csrf_token() }}"><button class="logout" type="submit"
            style="border:0;background:none;cursor:pointer">LOG OUT ↗</button></form>
        {% endif %}
      </div>
    </div>
  </header>
  {% block content %}{% endblock %}
</body>

</html>
